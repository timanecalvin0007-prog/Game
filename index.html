<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101525">
  <title>World Time — Digital Clock</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #101525;
      color: #f5f7ff;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 48px 20px;
      background:
        radial-gradient(ellipse at 15% 0%, #27345d 0, transparent 38%),
        radial-gradient(ellipse at 100% 80%, #203c48 0, transparent 35%),
        #101525;
    }
    main { width: min(100%, 1050px); margin: 0 auto; }
    header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 30px; }
    .eyebrow { margin: 0 0 8px; color: #91a5d8; font-size: .75rem; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(2rem, 5vw, 3.4rem); letter-spacing: -.055em; }
    .subtitle { margin: 9px 0 0; color: #aab3c9; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; }
    select, button {
      min-height: 44px; border: 1px solid #ffffff24; border-radius: 12px;
      padding: 0 14px; color: #f5f7ff; background: #20283bcc; font: inherit;
    }
    button { cursor: pointer; font-weight: 700; }
    button:hover { background: #354263; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 285px), 1fr)); gap: 16px; }
    .clock-card {
      position: relative; overflow: hidden; min-height: 205px; padding: 22px;
      border: 1px solid #ffffff18; border-radius: 20px;
      background: linear-gradient(145deg, #ffffff0e, #ffffff04);
      box-shadow: 0 18px 50px #0002; backdrop-filter: blur(12px);
    }
    .clock-card::after { position: absolute; right: -35px; bottom: -90px; width: 180px; height: 180px; border: 1px solid #ffffff0c; border-radius: 50%; content: ""; box-shadow: 0 0 0 22px #ffffff05, 0 0 0 44px #ffffff04; }
    .card-top { display: flex; justify-content: space-between; align-items: start; gap: 12px; }
    .city { margin: 0; font-size: 1.12rem; font-weight: 800; }
    .zone { margin: 5px 0 0; color: #aab3c9; font-size: .8rem; }
    .day-state { padding: 6px 9px; border: 1px solid #ffffff1b; border-radius: 20px; color: #d7dff4; font-size: .72rem; white-space: nowrap; }
    .time { margin: 24px 0 6px; font-size: clamp(2.4rem, 6vw, 3.15rem); font-variant-numeric: tabular-nums; font-weight: 750; letter-spacing: -.055em; line-height: 1; }
    .date { margin: 0; color: #aab3c9; font-size: .9rem; }
    .remove { position: absolute; z-index: 1; right: 14px; bottom: 12px; width: 34px; min-height: 34px; padding: 0; border-radius: 50%; color: #aab3c9; }
    .empty { grid-column: 1 / -1; padding: 30px; border: 1px dashed #ffffff30; border-radius: 18px; color: #aab3c9; text-align: center; }
    footer { margin-top: 24px; color: #7f8aa4; font-size: .8rem; text-align: center; }
    @media (max-width: 520px) { body { padding: 30px 14px; } header { align-items: stretch; } .toolbar { width: 100%; } .toolbar select { flex: 1; min-width: 0; } .toolbar button { flex: 1; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">A glance around the globe</p>
        <h1>World Time</h1>
        <p class="subtitle">Local time in your favorite time zones.</p>
      </div>
      <div class="toolbar">
        <select id="zoneSelect" aria-label="Choose a time zone"></select>
        <button id="addZone" type="button">＋ Add time zone</button>
      </div>
    </header>
    <section id="clocks" class="grid" aria-live="polite" aria-label="World clocks"></section>
    <footer>Times update automatically using your browser’s time-zone database.</footer>
  </main>
  <script>
    (() => {
      const availableZones = [
        ['Europe/Lisbon', 'Lisbon'], ['Europe/London', 'London'],
        ['Europe/Paris', 'Paris'], ['Europe/Athens', 'Athens'],
        ['America/New_York', 'New York'], ['America/Chicago', 'Chicago'],
        ['America/Los_Angeles', 'Los Angeles'], ['America/Sao_Paulo', 'São Paulo'],
        ['Asia/Dubai', 'Dubai'], ['Asia/Kolkata', 'Mumbai'],
        ['Asia/Singapore', 'Singapore'], ['Asia/Tokyo', 'Tokyo'],
        ['Australia/Sydney', 'Sydney'], ['Pacific/Auckland', 'Auckland']
      ];
      const defaultZones = ['Europe/Lisbon', 'America/New_York', 'Asia/Tokyo', 'Australia/Sydney'];
      let zones = [...defaultZones];
      const select = document.getElementById('zoneSelect');
      const container = document.getElementById('clocks');

      for (const [zone, city] of availableZones) {
        const option = document.createElement('option');
        option.value = zone;
        option.textContent = `${city} — ${zone}`;
        select.append(option);
      }

      function makeCard(zone, now) {
        const cityName = availableZones.find(item => item[0] === zone)?.[1] || zone.split('/').pop().replaceAll('_', ' ');
        const time = new Intl.DateTimeFormat(undefined, {
          timeZone: zone, hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
        }).format(now);
        const date = new Intl.DateTimeFormat(undefined, {
          timeZone: zone, weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
        }).format(now);
        const parts = new Intl.DateTimeFormat('en', { timeZone: zone, hour: 'numeric', hour12: false }).formatToParts(now);
        const hour = Number(parts.find(part => part.type === 'hour').value) % 24;
        const dayState = hour >= 6 && hour < 18 ? '☀ Daytime' : '☾ Night';
        const offset = new Intl.DateTimeFormat('en', { timeZone: zone, timeZoneName: 'short' })
          .formatToParts(now).find(part => part.type === 'timeZoneName')?.value || '';
        return `<article class="clock-card">
          <div class="card-top"><div><h2 class="city">${cityName}</h2><p class="zone">${zone} · ${offset}</p></div><span class="day-state">${dayState}</span></div>
          <p class="time" aria-label="${time}">${time}</p><p class="date">${date}</p>
          <button class="remove" type="button" data-zone="${zone}" aria-label="Remove ${cityName}" title="Remove clock">×</button>
        </article>`;
      }

      function render() {
        const now = new Date();
        container.innerHTML = zones.length ? zones.map(zone => makeCard(zone, now)).join('')
          : '<div class="empty">No clocks yet. Choose a time zone and add it.</div>';
        container.querySelectorAll('.remove').forEach(button => {
          button.addEventListener('click', () => {
            zones = zones.filter(zone => zone !== button.dataset.zone);
            render();
          });
        });
        for (const option of select.options) option.disabled = zones.includes(option.value);
        const nextOption = [...select.options].find(option => !option.disabled);
        if (nextOption) select.value = nextOption.value;
      }

      document.getElementById('addZone').addEventListener('click', () => {
        if (!zones.includes(select.value)) zones.push(select.value);
        render();
      });
      render();
      setInterval(render, 1000);
    })();
  </script>
</body>
</html>
